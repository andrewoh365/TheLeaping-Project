spring:
  application:
    name: portfolio-app

  datasource:
    url: jdbc:postgresql://localhost:5432/leaping_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: n3u3d4!
    hikari:
      # Connection pool settings to handle idle timeout issues
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000        # 10 minutes - close idle connections
      max-lifetime: 1800000       # 30 minutes - max connection lifetime
      connection-timeout: 20000   # 20 seconds to get a connection
      validation-timeout: 5000    # 5 seconds for validation query
      leak-detection-threshold: 60000  # 1 minute - detect connection leaks
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false
    locations: classpath:db/migration

jwt:
  secret: leaping-portfolio-jwt-secret-key-must-be-long-and-secure-at-least-256-bits-for-hs512-algorithm-encryption-very-long-key-here
  expiration: 3600000      # 1 hour
  refresh-expiration: 604800000 # 7 days

server:
  port: 8080
  servlet:
    context-path: /

