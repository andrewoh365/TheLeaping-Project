
# Keep scheduled market ingestion from racing with test application startup.
market.pricing.startup-backfill-enabled=false
market.pricing.refresh-ms=31536000000

# Test-only signing key; local and deployed environments must provide JWT_SECRET.
JWT_SECRET=ThisIsATestOnlyJwtSecretKeyWithAtLeast64CharactersForHS512SigningAlgo

# Test-only token for Spring Boot to FastAPI authentication.
ANALYTICS_INTERNAL_TOKEN=test-internal-token
