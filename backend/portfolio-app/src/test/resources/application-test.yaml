spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        database-platform: org.hibernate.dialect.H2Dialect
  
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: "ThisIsAVeryLongSecretKeyThatIsAtLeast512BitsLongForHS512AlgorithmTokenGenerationAndValidationPurposeExactly64BytesLong1234567890"
  expiration: 86400000

server:
  port: 8080
