# ============================================================
# LEAP - runs the whole application in containers
#
#   docker-compose up -d --build    build the images and start everything
#   docker-compose ps               show what is running
#   docker-compose logs -f          follow the logs
#   docker-compose down             stop and remove the containers (database is kept)
#
# Secrets (DB_USERNAME, DB_PASSWORD, JWT_SECRET) are read from the
# gitignored .env file next to this file and injected into the containers.
# ============================================================

name: leap

services:

  # Official image, no Dockerfile needed.
  # Not published to the host: only the other containers can reach it.
  postgres:
    build: ./infrastructure/postgres/primary
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=2
      - -c
      - max_slot_wal_keep_size=2048MB
    environment:
      POSTGRES_DB: leaping_db
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is not set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
      REPLICATION_NETWORK_CIDR: 172.30.0.0/24
      REPLICATION_USER: leap_replication
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - leap-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d leaping_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 2G

  postgres-replication-init:
    image: postgres:16
    entrypoint: ["bash", "/provision-primary.sh"]
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: leaping_db
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      REPLICATION_USER: leap_replication
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD is not set in .env}
      REPORTING_DB_USERNAME: leap_reporting
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is not set in .env}
      REPLICATION_SLOT: leap_reporting_slot
    volumes:
      - ./infrastructure/postgres/provision-primary.sh:/provision-primary.sh:ro
    networks:
      - leap-data
    depends_on:
      postgres:
        condition: service_healthy
      portfolio-app:
        condition: service_started

  postgres-replica:
    build: ./infrastructure/postgres/replica
    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      PRIMARY_DB_NAME: leaping_db
      REPLICATION_USER: leap_replication
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?REPLICATION_PASSWORD is not set in .env}
      REPLICATION_SLOT: leap_reporting_slot
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is not set in .env}
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    networks:
      - leap-data
    depends_on:
      postgres-replication-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD=$${REPORTING_DB_PASSWORD}
          psql -U leap_reporting -d leaping_db -Atqc
          "SELECT pg_is_in_recovery()" | grep -qx t
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1G

  # Spring Boot API. Listens on 8080 inside the Docker network only.
  portfolio-app:
    build: ./backend/portfolio-app
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is not set in .env}
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN:?ANALYTICS_INTERNAL_TOKEN is not set in .env}
      # Override the localhost defaults in application.yaml with service names
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/leaping_db
      ANALYTICS_SERVICE_BASE_URL: http://analytics-service:8000
    networks:
      - leap-data
    depends_on:
      postgres:
        condition: service_healthy

  # Python analytics service. Listens on 8000 inside the Docker network only.
  analytics-service:
    build: ./backend/analytics-service
    environment:
      ANALYTICS_DB_USERNAME: leap_reporting
      ANALYTICS_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?REPORTING_DB_PASSWORD is not set in .env}
      ANALYTICS_DB_HOST: postgres-replica
      ANALYTICS_DB_PORT: 5432
      ANALYTICS_DB_NAME: leaping_db
      ANALYTICS_INTERNAL_TOKEN: ${ANALYTICS_INTERNAL_TOKEN:?ANALYTICS_INTERNAL_TOKEN is not set in .env}
    networks:
      - leap-data
    depends_on:
      postgres-replica:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M

  # nginx serving the Angular app and forwarding /api to portfolio-app.
  # The only service published to the host (host port : container port).
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - portfolio-app
    networks:
      - leap-data

volumes:
  postgres-data:
  postgres-replica-data:

networks:
  leap-data:
    name: leap-data-network
    ipam:
      config:
        - subnet: 172.30.0.0/24
