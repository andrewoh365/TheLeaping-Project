<div class="dashboard-container">
  <mat-toolbar class="toolbar">
    <button mat-icon-button class="hamburger">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="spacer"></span>
    <div class="logo-container">
      <mat-icon class="logo-icon">eject</mat-icon>
      <span class="toolbar-title">MIGUELITY</span>
    </div>
    <span class="spacer"></span>
    <button mat-icon-button class="user-icon-button" [matMenuTriggerFor]="menu">
      <mat-icon>account_circle</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item disabled>
        <mat-icon>person</mat-icon>
        <span>{{ currentUser?.email || 'User' }}</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <div class="searchbar-section">
    <div class="search-wrapper">
      <input 
        type="text" 
        class="search-input" 
        [(ngModel)]="searchQuery" 
        (input)="onSearchInput()"
        placeholder="Enter a symbol or name"
        aria-label="Search"
      />
      <mat-icon class="search-icon">search</mat-icon>
    </div>
    <div class="search-results">
      <div *ngFor="let result of searchResults" class="search-result-item"> 
        <div class="result-header">
          <h3>{{ result?.symbol }}</h3>
        </div>
      </div>
    </div>

  </div>

  <div class="dashboard-content">
    <div>
      <mat-card class="portfolio-card">
        <div >
          <button mat-raised-button class="dashboard-button">Individual</button>
          <button mat-raised-button class="dashboard-button">ForEx</button>
          <button mat-raised-button class="dashboard-button">Crypto</button>  
          <mat-card-header>
            <mat-card-title>CHART </mat-card-title>
          </mat-card-header>
        </div>
      </mat-card>
