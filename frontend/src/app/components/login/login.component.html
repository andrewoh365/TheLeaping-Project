<div class="login-container">
  <!-- Decorative backdrop: glows and grid -->
  <div class="login-backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="grid"></div>
  </div>

  <mat-card class="login-card">
    <div class="login-heading">
      <h1>Login</h1>
      <p>Welcome back to Leaping Portfolio</p>
    </div>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Error Alert -->
        <div *ngIf="errorMessage" class="error-message">
          <mat-icon>error</mat-icon>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Email Field -->
        <mat-form-field class="full-width">
          <mat-label>Email</mat-label>
          <input
            matInput
            type="email"
            formControlName="email"
            placeholder="Enter your email"
          />
          <mat-error *ngIf="f['email'].hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="f['email'].hasError('email')">
            Enter a valid email address
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="Enter your password"
          />
          <button
            mat-icon-button
            matSuffix
            (click)="togglePasswordVisibility()"
            type="button"
          >
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="f['password'].hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="f['password'].hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <!-- Submit Button -->
        <button
          mat-raised-button
          color="primary"
          class="full-width submit-btn"
          [disabled]="loading"
          type="submit"
        >
          <mat-spinner
            *ngIf="loading"
            diameter="20"
            class="spinner"
          ></mat-spinner>
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <!-- Quick demo logins (development builds only) -->
      <div class="demo-logins" *ngIf="demoLogins.length > 0">
        <div class="demo-divider"><span>or sign in as a demo user</span></div>
        <div class="demo-grid">
          <button
            type="button"
            class="demo-option"
            *ngFor="let demo of demoLogins"
            [class.active]="activeDemo === demo.persona"
            [disabled]="loading"
            [attr.aria-label]="'Sign in as ' + demo.persona + ', ' + demo.role"
            (click)="loginAs(demo)"
          >
            <span class="demo-avatar" aria-hidden="true">{{ demo.persona.charAt(0) }}</span>
            <span class="demo-name">{{ demo.persona }}</span>
            <span class="demo-role">{{ demo.role }}</span>
          </button>
        </div>
      </div>

      <!-- Links -->
      <div class="links">
        <p>Don't have an account? <a routerLink="/register">Register here</a></p>
        <p><a href="#forgot">Forgot your password?</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
